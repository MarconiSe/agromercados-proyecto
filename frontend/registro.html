<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | Agromercados</title>

    <link
        rel="stylesheet"
        href="./src/style/base.css"
    >

    <link
        rel="stylesheet"
        href="./src/style/forms.css"
    >
</head>

<body>

    <header class="header">
        <a href="./index.html" class="logo">
            AGROMERCADOS
        </a>
    </header>

    <main class="form-page">

        <section class="form-card">

            <h1>Crear cuenta</h1>

            <form id="registro-form">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    id="nombre"
                    required
                >

                <label for="email">
                    Correo
                </label>

                <input
                    id="email"
                    type="email"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    required
                >

                <button
                    class="btn primary"
                    type="submit"
                >
                    Crear cuenta
                </button>

            </form>

            <p
                id="mensaje"
                class="mensaje"
            ></p>

            <p>
                ¿Ya tienes cuenta?
                <a href="./login.html">
                    Iniciar sesión
                </a>
            </p>

        </section>

    </main>

    <script
        type="module"
        src="./src/registro.js"
    ></script>

</body>
</html>
