<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | AgroYa</title>

    <link
        rel="stylesheet"
        href="./src/style/base.css"
    >

    <link
        rel="stylesheet"
        href="./src/style/forms.css"
    >
</head>

<body>

    <main class="form-page">

        <section class="form-card">

            <a href="./index.html" class="logo"><span class="agro">Agro</span><span class="ya">Ya</span></a>

            <form id="registro-form">

                <input
                    id="nombre"
                    placeholder="Nombre"
                    aria-label="Nombre"
                    required
                >

                <input
                    id="email"
                    type="email"
                    placeholder="Correo"
                    aria-label="Correo"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Contraseña"
                    aria-label="Contraseña"
                    required
                >

                <button
                    class="btn primary"
                    type="submit"
                >
                    Crear Usuario
                </button>

            </form>

            <p
                id="mensaje"
                class="mensaje"
            ></p>

            <p>
                ¿Ya tienes cuenta?<br>
                <a href="./login.html">
                    Ingresar
                </a>
            </p>

        </section>

    </main>

    <script
        type="module"
        src="./src/registro.js"
    ></script>

</body>
</html>
