<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi pedido | AgroYa</title>

    <link
        rel="stylesheet"
        href="./src/style/base.css"
    >

    <link
        rel="stylesheet"
        href="./src/style/forms.css"
    >

</head>

<body>

    <header class="header">

        <a href="./index.html" class="logo"><span class="agro">Agro</span><span class="ya">Ya</span></a>

        <nav class="nav">
            <a href="./index.html">
                Productos
            </a>

            <a href="./mis-pedidos.html">
                Mis pedidos
            </a>

            <button
                id="logout"
                class="link-button"
                type="button"
            >
                Cerrar sesión
            </button>
        </nav>

    </header>

    <main class="container pedido-layout">

        <section>

            <h1>Mi pedido</h1>

            <section id="carrito"></section>

            <div class="total-box">
                <span>Total</span>
                <strong id="total">$0.00</strong>
            </div>

        </section>

        <form id="pedido-form" class="pedido-box">

            <label for="agromercado">
                Lugar de retiro
            </label>

            <select
                id="agromercado"
                required
            ></select>

            <label for="fecha">
                Fecha
            </label>

            <input
                id="fecha"
                type="date"
                required
            >

            <label for="horario">
                Hora
            </label>

            <select
                id="horario"
                required
            ></select>

            <div class="button-row">

                <a href="./index.html" class="regresar">
                    Regresar
                </a>

                <button
                    type="submit"
                    class="btn primary"
                >
                    Confirmar Pedido
                </button>

            </div>

        </form>

        <p
            id="mensaje"
            class="mensaje"
        ></p>

    </main>

    <script
        type="module"
        src="./src/pedido.js"
    ></script>

</body>
</html>
