<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Productos</title>

    <link
        rel="stylesheet"
        href="../src/style/base.css"
    >

    <link
        rel="stylesheet"
        href="../src/style/forms.css"
    >

    <link
        rel="stylesheet"
        href="../src/style/admin.css"
    >

</head>

<body>

    <header class="header">

        <a href="../index.html" class="logo">
            AGROMERCADOS ADMIN
        </a>

        <nav class="nav">

            <a href="./productos.html">
                Productos
            </a>

            <a href="./pedidos.html">
                Pedidos
            </a>

            <button
                id="logout"
                class="link-button"
            >
                Cerrar sesión
            </button>

        </nav>

    </header>

    <main class="container">

        <div class="admin-grid">

            <section>

                <h1>Productos</h1>

                <table>

                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Disponible</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="productos"></tbody>

                </table>

            </section>

            <section class="form-card">

                <h2 id="form-title">
                    Nuevo producto
                </h2>

                <form id="producto-form">

                    <label>Nombre</label>
                    <input id="nombre" required>

                    <label>Descripción</label>
                    <input id="descripcion" required>

                    <label>Categoría</label>
                    <input id="categoria" required>

                    <label>Precio</label>

                    <input
                        id="precio"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >

                    <label>Disponible</label>

                    <select id="disponible">
                        <option value="true">
                            Sí
                        </option>

                        <option value="false">
                            No
                        </option>
                    </select>

                    <label>Imagen URL</label>

                    <input id="imagenUrl">

                    <div class="button-row">

                        <button
                            class="btn primary"
                            type="submit"
                        >
                            Guardar
                        </button>

                        <button
                            id="cancelar"
                            class="btn secondary"
                            type="button"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

                <p
                    id="mensaje"
                    class="mensaje"
                ></p>

            </section>

        </div>

    </main>

    <script
        type="module"
        src="../src/admin-productos.js"
    ></script>

</body>
</html>
